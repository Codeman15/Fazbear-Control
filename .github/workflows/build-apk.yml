name: Build Fazbear Control APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

             - name: Find Android project ZIP
        run: |
          echo "Current directory:"
          pwd

          echo "Files in repository:"
          ls -la

          echo "ZIP files found:"
          find . -maxdepth 3 -type f -iname "*.zip" -print

      - name: Build debug APK
        working-directory: fazbear_theme_work
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fazbear-Control-debug-apk
          path: fazbear_theme_work/app/build/outputs/apk/debug/app-debug.apk
