name: Build Fazbear Control APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # GET THE REPOSITORY
      # --------------------------------------------------
      - name: Download repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # EXTRACT ANDROID PROJECT
      # --------------------------------------------------
      - name: Extract Android project
        run: |
          echo "======================================"
          echo "EXTRACTING FAZBEAR CONTROL PROJECT"
          echo "======================================"

          unzip -o FAZBEAR_CONTROL_GITHUB_APK_PROJECT.zip

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "Checking Android project..."

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/fazbear/control/MainActivity.java

          echo ""
          echo "Android project found successfully."


      # --------------------------------------------------
      # JAVA 17
      # --------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------
      # GRADLE 8.7
      # --------------------------------------------------
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      # --------------------------------------------------
      # CHECK GRADLE PROJECT
      # --------------------------------------------------
      - name: Check Gradle project
        run: |
          echo "======================================"
          echo "GRADLE PROJECT"
          echo "======================================"

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Project contents:"
          ls -la

          echo ""
          echo "App contents:"
          ls -la app

          echo ""
          echo "Gradle version:"
          gradle --version


      # --------------------------------------------------
      # BUILD DEBUG APK
      # --------------------------------------------------
      - name: Build debug APK
        run: |
          echo "======================================"
          echo "BUILDING FAZBEAR CONTROL APK"
          echo "======================================"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

          echo ""
          echo "APK BUILD COMPLETE."


      # --------------------------------------------------
      # VERIFY APK
      # --------------------------------------------------
      - name: Verify APK
        run: |
          echo "======================================"
          echo "VERIFYING APK"
          echo "======================================"

          ls -lh app/build/outputs/apk/debug/

          test -f app/build/outputs/apk/debug/app-debug.apk

          echo ""
          echo "APK FOUND SUCCESSFULLY."


      # --------------------------------------------------
      # UPLOAD APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fazbear-Control-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
